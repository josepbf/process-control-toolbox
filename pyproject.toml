[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "process-control-toolbox"
version = "0.1.0"
description = "A toolbox for classical process control: plants, controllers, tuning rules, robustness analysis and a simulation harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Josep Blazquez" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["process_control*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
